# Render Blueprint for the Hintro API. Deploy: New > Blueprint > pick this repo.
# The frontend deploys separately to Vercel (see README).
services:
  - type: web
    name: hintro-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hintro-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGIN
        value: "*"
      - key: CANDIDATE_NAME
        value: Aman Kumar
      - key: CANDIDATE_EMAIL
        value: aman0611kumar@gmail.com
      # Provide these in the Render dashboard (sync: false keeps them out of git):
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: REPOSITORY_URL
        sync: false
      - key: DEPLOYED_URL
        sync: false

databases:
  - name: hintro-db
    plan: free
    postgresMajorVersion: "16"
