name: Scheduled Reminders

# Triggers the overdue-reminder job on the deployed API every 15 minutes.
# Configure repository secrets:
#   API_URL     -> https://your-hintro-api.onrender.com
#   CRON_SECRET -> the same value set on the API service
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  trigger-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Call reminder job
        run: |
          if [ -z "${{ secrets.API_URL }}" ]; then
            echo "API_URL secret not set; skipping."
            exit 0
          fi
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" \
            -X POST "${{ secrets.API_URL }}/api/jobs/reminders" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}")
          echo "HTTP $code"
          cat /tmp/out.json
          test "$code" = "200"
